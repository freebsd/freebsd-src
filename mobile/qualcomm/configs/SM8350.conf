#
# $FreeBSD$
#
# Qualcomm Snapdragon 8cx Gen 2 (SM8350) SoC Configuration
# ARM Cortex-X1 @ 2.84GHz + Cortex-A78 @ 2.42GHz + Cortex-A55 @ 1.80GHz
#

include           GENERIC

ident             SM8350

# -- Ident --
machine           arm64
cpu               CORTEX_X1
cpu               CORTEX_A78
cpu               CORTEX_A55

# -- SMP --
options           SMP
options           MAXCPU=8
options           CPU_QCOM_SOC

# -- SoC --
options           QCOM_SOC
options           QCOM_GCC
options           QCOM_PDC
options           QCOM_RPMH
options           QCOM_RPM
options           QCOM_PMIC
options           QCOM_CLK
options           QCOM_REGULATOR
options           QCOM_APCS
options           QCOM_GICV3
options           QCOM_HARDENING

# -- CPU Frequency --
options           CPUFREQ
options           QCOM_CPUFREQ
options           RPMPD
options           QCOM_CPUPD

# -- Thermal --
options           QCOM_TSENS
options           QCOM_SPMI_TEMP_ALERT

# -- Security --
options           QCOM_QTI
options           QCOM_TZ
options           QCOM_QSEECOM

# -- GPU --
device            adreno,a680
options           DRM
options           DRM_KMS_HELPER
options           DRM_GEM_SHMEM_HELPER

# -- Display --
options           QCOM_MDSS
options           QCOM_DSI
options           QCOM_EBI2
options           QCOM_SDE

# -- Modem / Connectivity --
options           QCOM_RMNET
options           QCOM_QMI
options           QCOM_RMNET_DATA
options           QCOM_WLAN
options           QCOM_IPA

# -- Audio --
options           QCOM_APR
options           QCOM_DSP_Q6
options           QCOM_AVS

# -- Storage --
options           QCOM_UFS
options           UFS
options           MMC

# -- USB --
options           QCOM_USB
options           XHCI
options           QCOM_QMP
options           QUSB2
options           QUSB3

# -- WiFi / BT --
options           QCOM_WCNSS
options           ATH10K

# -- Networking --
options           INET
options           INET6

# -- Scheduler --
options           SCHED_ULE
options           PREEMPTION
options           HZ=1000

# -- Mobile OS --
options           CONFIG_MOBILE_OS
options           LOW_LATENCY
options           POWER_EFFICIENT
