#
# MediaTek MT6893 (Dimensity 1100) kernel configuration
# 4x Cortex-A78 + 4x Cortex-A55
# ARM Mali-G77 MC9 GPU
#

ident       MT6893

# CPU and core options
options     CPU_MTK_SOC
options     MTK_SOC
options     SMP
options     MAXCPU=8
options     SCHED_ULE
options     PREEMPTION
options     HZ=1000

# Power management
options     MTK_PMIC
options     MT6397
options     MT6315
options     MT6363
options     MTK_DVFS
options     MTK_SPM
options     MTK_PWRAP

# MTK-specific drivers
device      mtk_timer
device      mtk_gic
device      mtk_uart
device      mtk_i2c
device      mtk_spi
device      mtk_gpio
device      mtk_smi
device      mtk_m4u_io
device      mtk_apu
device      mtk_cc
device      mtk_mmdvfs
device      mtk_cpufreq
device      mtk_thermal
device      mtk_adsp
device      mtk_audio
device      mtk_camera

# Display subsystem
device      mtk_dsi
device      mtk_dsi_v3
device      mtk_mipi_tx
device      drm
device      fb
options     MTK_DISP

# GPU support
device      arm_mali_g77

# Modem support
device      mtk_md

# Storage
device      mmc
device      mtk_mmc
device      mtk_msdc

# USB support
device      xhci
device      mtk_xhci
options     USB3
device      typec
device      tcpc

# WiFi and Bluetooth
options     MTK_WIFI
options     MTK_CONNAC
options     MTK_WFD
options     MTK_WLAN

# Sensor hub
options     MTK_SENSORHUB

# Audio subsystem
options     MTK_SOUND
options     SND_SOC
options     MTK_AUDIO_CM
options     MTK_AADSP

# Security (TEE)
options     MTK_TEEGRIS
options     MTK_TRUSTONIC
options     MTK_OPTEE

# Mobile OS options
options     CONFIG_MOBILE_OS
options     LOW_LATENCY
options     POWER_EFFICIENT

# Filesystems
options     FFS
options     SOFTUPDATES
options     TMPFS
options     NULLFS
options     PROCFS
options     CD9660

# Networking
options     INET
options     INET6
options     PPP
options     SLIP

# Required arm64 options
machine     arm64
makeoptions AS="clang"
makeoptions LD="lld"

# Standard arm64 options
options     ARM64
options     IGN_NEVER_TIMING
options     NO_IVORS

# Device hints
hint.apci.0.at="acpi0"
hint.apic.0.at="acpi0"