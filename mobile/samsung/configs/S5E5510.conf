#
# S5E5510 -- Kernel configuration for Samsung Exynos 850 (A13/A04)
#             UOS Mobile OS (FreeBSD-based)
# SoC: Samsung Exynos 850 | CPU: 8xCortex-A55 (budget segment)
# GPU: Mali-G52 MP2 | Device: Galaxy A13/A04/A04e/A04s
#

cpu		ARM64
ident		S5E5510

makeoptions	DEBUG=-g
makeoptions	CFLAGS+="-mbranch-protection=pac-ret"
makeoptions	COPTFLAGS="-O2"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# SoC Options
options		CPU_EXYNOS_SOC
options		SOC_EXYNOS_S5E5510
options		EXYNOS_PM
options		EXYNOS_PMU

# Mobile OS
options		MOBILE_OS
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP

# Power & Thermal
options		CPUFREQ_DT
options		EXYNOS_CPUFREQ

# Input
device		hid
device		hidbus
device		hmt
device		hidraw
device		exynos_i2c

# SPI
device		spibus
device		exynos_spi

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
device		mali_g52

# Audio
device		sound
options		EXYNOS_AUDIO
device		exynos_audio

# USB
device		usb
device		dwc3
device		xhci

# Storage
device		geom
device		geom_part_gpt
options		UFS
options		EXYNOS_FSD
device		exynos_ufs

# Security
options		ARM_TRUSTED_FIRMWARE

# Filesystems
options		FFS
options		SOFTUPDATES
options		UFS_DIRHASH
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/samsung_exynos"