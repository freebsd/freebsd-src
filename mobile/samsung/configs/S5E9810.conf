#
# S5E9810 -- Kernel configuration for Samsung Exynos 2100 (S21 series)
#             UOS Mobile OS (FreeBSD-based)
# SoC: Samsung Exynos 2100 | CPU: 1xCortex-X1 + 3xCortex-A78 + 4xCortex-A55
# GPU: Xclipse 920 (AMD RDNA1) | Device: Galaxy S21/S21+/S21 Ultra
#

cpu		ARM64
ident		S5E9810

makeoptions	DEBUG=-g
makeoptions	CFLAGS+="-mbranch-protection=pac-ret"
makeoptions	COPTFLAGS="-O2"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# SoC Options
options		CPU_EXYNOS_SOC
options		SOC_EXYNOS_S5E9810
options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO

# Mobile OS
options		MOBILE_OS
options		LOW_LATENCY
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		ARMV8_PMU
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL

# Input & I2C
device		hid
device		hidbus
device		hmt
device		exynos_i2c
device		iicbus
device		iic

# USB
device		usb
options		EXYNOS_TYPEC
options		EXYNOS_USBPD
device		dwc3

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_DPU
device		amd_lorenzo

# Audio
device		sound
options		EXYNOS_AUDIO
options		SND_SOC
device		exynos_audio

# Camera
options		EXYNOS_FIMC
options		EXYNOS_CSIS
options		EXYNOS_JPEG
options		EXYNOS_SCALER
device		exynos_fimc

# Storage
device		geom
device		geom_part_gpt
options		UFS
options		EXYNOS_FSD
device		exynos_ufs

# Security
options		EXYNOS_TZ
options		ARM_TRUSTED_FIRMWARE

# Filesystems
options		FFS
options		SOFTUPDATES
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

# Linux compat
options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

# Security (UOS)
options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/samsung_exynos"