#
# S5E8845 -- Kernel configuration for Samsung Exynos 1380 (A54/A34)
#             UOS Mobile OS (FreeBSD-based)
# SoC: Samsung Exynos 1380 | CPU: 4xCortex-A78 + 4xCortex-A55
# GPU: Mali-G68 MP4 | Device: Galaxy A54/A34 5G
#

cpu		ARM64
ident		S5E8845

makeoptions	DEBUG=-g
makeoptions	WITH_CTF=1
makeoptions	CFLAGS+="-mbranch-protection=pac-ret"
makeoptions	COPTFLAGS="-O2"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# SoC Options
options		CPU_EXYNOS_SOC
options		SOC_EXYNOS_S5E8845
options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO

# Mobile OS
options		MOBILE_OS
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		ARMV8_PMU
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL

# Input
device		hid
device		hidbus
device		hmt
device		hidraw
device		exynos_i2c
device		iicbus
device		iic

# SPI
device		spibus
device		exynos_spi

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_LCD
options		EXYNOS_DPU
device		mali_g68

# Audio
device		sound
options		EXYNOS_AUDIO
options		SND_SOC
options		EXYNOS_CODEC
device		exynos_audio

# USB
device		usb
options		EXYNOS_TYPEC
device		dwc3
device		xhci

# Camera
options		EXYNOS_FIMC
options		EXYNOS_CSIS
device		exynos_fimc
device		exynos_csis

# Storage
device		geom
device		geom_part_gpt
options		UFS
options		EXYNOS_FSD
device		exynos_ufs

# Security
options		EXYNOS_TZ
options		ARM_TRUSTED_FIRMWARE

# Filesystems
options		FFS
options		SOFTUPDATES
options		UFS_DIRHASH
options		TMPFS
options		NULLFS
options		FDESCFS
options		PROCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

# Linux compat
options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

# Security (UOS)
options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/samsung_exynos"