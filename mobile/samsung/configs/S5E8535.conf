#
# S5E8535 -- Kernel configuration for Samsung Exynos 1330 (A14/A24/M14)
#             UOS Mobile OS (FreeBSD-based)
# SoC: Samsung Exynos 1330 | CPU: 2xCortex-A78 + 6xCortex-A55
# GPU: Mali-G68 MP2 | Device: Galaxy A14/A24/M14
#

cpu		ARM64
ident		S5E8535

makeoptions	DEBUG=-g
makeoptions	CFLAGS+="-mbranch-protection=pac-ret"
makeoptions	COPTFLAGS="-O2"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# SoC Options
options		CPU_EXYNOS_SOC
options		SOC_EXYNOS_S5E8535
options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO

# Mobile OS
options		MOBILE_OS
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		ARMV8_PMU
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL

# Input
device		hid
device		hidbus
device		hmt
device		hidraw
device		exynos_i2c

# USB
device		usb
options		EXYNOS_TYPEC
device		dwc3
device		xhci

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_DPU
device		mali_g68

# Audio
device		sound
options		EXYNOS_AUDIO
options		SND_SOC
device		exynos_audio

# Storage
device		geom
device		geom_part_gpt
options		UFS
options		EXYNOS_FSD
device		exynos_ufs

# Security
options		ARM_TRUSTED_FIRMWARE

# Filesystems
options		FFS
options		SOFTUPDATES
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/samsung_exynos"