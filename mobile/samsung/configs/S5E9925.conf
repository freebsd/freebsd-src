#
# S5E9925 -- Kernel configuration for Samsung Exynos 2200 (S22 series)
#             UOS Mobile OS (FreeBSD-based)
# SoC: Samsung Exynos 2200 | CPU: 1xCortex-X2 + 3xCortex-A710 + 4xCortex-A510
# GPU: Xclipse 2200 (AMD RDNA2) | Device: Galaxy S22/S22+/S22 Ultra
#

cpu		ARM64
ident		S5E9925

makeoptions	DEBUG=-g
makeoptions	WITH_KERNEL_BIN=1
makeoptions	CFLAGS+="-mbranch-protection=pac-ret+leaf+bti"
makeoptions	COPTFLAGS="-O3"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# SoC Options
options		CPU_EXYNOS_SOC
options		SOC_EXYNOS_S5E9925
options		EXYNOS_OSCC
options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO
options		EXYNOS_EMBEDDED_ISP
options		EXYNOS_BUSMONITOR
options		EXYNOS_ITMON
options		EXYNOS_RTIC

# Mobile OS
options		MOBILE_OS
options		LOW_LATENCY
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		ARMV8_PMU
device		hwpmc
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL
options		EXYNOS_GPU_THERMAL

# Input
device		hid
device		hidbus
device		hmt
device		hidraw
device		exynos_i2c
device		iicbus
device		iic

# SPI & USB
device		spibus
device		exynos_spi
device		usb
options		EXYNOS_USB
options		EXYNOS_TYPEC
options		EXYNOS_USBPD
device		dwc3
device		xhci

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_LCD
options		EXYNOS_DPU
device		amd_lgm

# Audio
device		sound
options		EXYNOS_AUDIO
options		SND_SOC
device		exynos_audio

# Camera
options		EXYNOS_FIMC
options		EXYNOS_CSIS
options		EXYNOS_JPEG
options		EXYNOS_SCALER
device		exynos_fimc
device		exynos_csis

# Storage
device		geom
device		geom_part_gpt
options		UFS
options		EXYNOS_FSD
options		EXYNOS_MC
device		exynos_ufs

# Modem
options		S52XX_SHMC
options		EXYNOS_MODEM

# Security
options		EXYNOS_TZ
options		ARM_TRUSTED_FIRMWARE
options		OPTEE

# Filesystems
options		FFS
options		SOFTUPDATES
options		UFS_DIRHASH
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

# Linux compat
options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

# Security (UOS)
options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/samsung_exynos"