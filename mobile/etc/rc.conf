# UOS Mobile OS - System Configuration
# This file is read by /etc/rc at boot time

uos_hostname="uos-mobile"

# Network
ifconfig_vtnet0="DHCP"
# ifconfig_wlan0="WPA DHCP"

# System services
sshd_enable="YES"
moused_enable="NO"
sendmail_enable="NONE"
zfs_enable="NO"

# UOS Mobile services
uos_displayd_enable="YES"
uos_powerd_enable="YES"
uos_networkd_enable="YES"
uos_audiod_enable="YES"
uos_timed_enable="YES"
uos_pkgd_enable="YES"
