#
# zuma -- Kernel configuration for Google Tensor G3 (Pixel 8)
#          UOS Mobile OS (FreeBSD-based)
# SoC: Google Tensor G3 | CPU: 1xCortex-X3 + 4xCortex-A715 + 4xCortex-A510
# GPU: IMG BXS-4-64 | Device: Pixel 8/8 Pro
#

cpu		ARM64
ident		TENSOR_ZUMA

makeoptions	DEBUG=-g
makeoptions	CFLAGS+="-mbranch-protection=pac-ret+leaf+bti"
makeoptions	COPTFLAGS="-O3"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# Tensor G3 SoC Options
options		CPU_EXYNOS_SOC
options		SOC_TENSOR_G3

options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO

# Tensor-specific
options		TENSOR_TPU
options		TENSOR_EDGETPU

# Mobile OS
options		MOBILE_OS
options		LOW_LATENCY
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		ARMV8_PMU
device		hwpmc
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL

# Input
device		hid
device		hidbus
device		hmt
device		exynos_i2c

# USB
device		usb
options		EXYNOS_USB
options		EXYNOS_TYPEC
options		EXYNOS_USBPD
device		dwc3

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_DPU_G3
device		img_bxs_4_64

# Audio
device		sound
options		EXYNOS_AUDIO
device		exynos_audio

# Storage
device		geom
device		geom_part_gpt
options		UFS
device		exynos_ufs

# Filesystems
options		FFS
options		SOFTUPDATES
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/google_tensor"