#
# bluejay -- Kernel configuration for Google Tensor G2 (Pixel 7a)
#           UOS Mobile OS (FreeBSD-based)
# SoC: Google Tensor G2 | CPU: 2xCortex-X1 + 2xCortex-A79 + 4xCortex-A510
# GPU: Mali-G78 MP20 | Device: Pixel 7/7 Pro/7a
#

cpu		ARM64
ident		TENSOR_BLUEJAY

makeoptions	DEBUG=-g
makeoptions	CFLAGS+="-mbranch-protection=pac-ret+leaf+bti"
makeoptions	COPTFLAGS="-O3"

include		"std.arm64"
include		"std.dev"
include		"std.exynos"

# Tensor G2 SoC Options
options		CPU_EXYNOS_SOC
options		SOC_TENSOR_G2

options		EXYNOS_PM
options		EXYNOS_PMU
options		EXYNOS_CPUINFO

# Tensor-specific
options		TENSOR_TPU
options		TENSOR_EDGETPU

# Mobile OS
options		MOBILE_OS
options		LOW_LATENCY
options		POWER_EFFICIENT

# Scheduler
options		SCHED_ULE
options		PREEMPTION
options		HZ=250
options		SMP
options		MAXCPU=8

# Power & Thermal
options		CPUFREQ_DT
options		EXYNOS_CPUFREQ
options		EXYNOS_THERMAL

# Input
device		hid
device		hidbus
device		hmt
device		exynos_i2c

# USB
device		usb
options		EXYNOS_TYPEC
device		dwc3

# Display
device		drm
device		vt
device		vt_efifb
options		EXYNOS_MIPI
options		EXYNOS_DSIM
options		EXYNOS_DPU
device		arm_liger

# Audio
device		sound
options		EXYNOS_AUDIO
device		exynos_audio

# Storage
device		geom
device		geom_part_gpt
options		UFS
device		exynos_ufs

# Filesystems
options		FFS
options		SOFTUPDATES
options		TMPFS
options		NULLFS
options		FDESCFS

# Networking
options		INET
options		INET6
device		loop
device		ether

options		COMPAT_LINUX64
options		COMPAT_LINUXKPI

options		UOS_SECURITY
options		ARM64_BTI
options		ARM64_PAC

makeoptions	MODULES_EXTRA+="dtb/google_tensor"