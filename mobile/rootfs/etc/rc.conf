# UOS Mobile OS - /etc/rc.conf
# Copy to rootfs/etc/rc.conf during install

uos_hostname="uos-mobile"
ifconfig_vtnet0="DHCP"
sshd_enable="YES"
moused_enable="NO"
sendmail_enable="NONE"
zfs_enable="NO"

# UOS services
uos_displayd_enable="YES"
uos_powerd_enable="YES"
uos_networkd_enable="YES"
uos_audiod_enable="YES"
uos_timed_enable="YES"
uos_pkgd_enable="YES"
