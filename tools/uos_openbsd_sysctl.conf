# =============================================================================
# UOS Mobile - OpenBSD Level Hardening Sysctls
# =============================================================================
# To be loaded via /etc/sysctl.conf or directly during init.
# These map OpenBSD security defaults (ASLR, W^X, Network blackholes)
# into the UOS/FreeBSD compatibility layer.
# =============================================================================

# 1. ASLR and Memory Mitigations
# Randomize the base address mapping
kern.elf64.aslr.enable=1
kern.elf32.aslr.enable=1
kern.elf64.aslr.pie_enable=1
kern.elf32.aslr.pie_enable=1
kern.elf64.aslr.honor_sbrk=0

# Exploit mitigations (Prevent mapping at address 0)
security.bsd.map_at_zero=0

# W^X / Execute Disable
# Prevent W^X memory mappings globally where supported by ARM64/RV64
kern.elf64.nxstack=1
kern.elf32.nxstack=1

# 2. Process Visibility (Similar to OpenBSD hide_pid)
# Prevent users from seeing processes they do not own
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.see_jail_proc=0
security.bsd.unprivileged_proc_debug=0

# Randomize process IDs (makes PID guessing harder)
kern.randompid=1337

# 3. Kernel Address Layout Randomization (KASLR/KPT)
kern.smp.forward_signal_enabled=0

# Stack Gap randomization
kern.elf64.aslr.stack_gap=1

# 4. Network Hardening (Blackhole routing)
# Drop packets silently instead of sending RST to closed ports (OpenBSD style)
net.inet.tcp.blackhole=2
net.inet.udp.blackhole=1

# Drop ICMP redirects / disable routing capabilities for a mobile endpoint
net.inet.icmp.drop_redirect=1
net.inet.ip.redirect=0
net.inet6.ip6.redirect=0

# Randomize TCP/UDP ephemeral ports
net.inet.ip.portrange.randomized=1

# Disable TCP fastopen for untrusted contexts (mitigate certain spoofing)
net.inet.tcp.fastopen.client_enable=0

# 5. File System and Core Dump Restrictions
# Do not dump core for setuid programs or anything else by default
kern.coredump=0
kern.sugid_coredump=0

# Prevent symlink attacks in /tmp
security.bsd.hardlink_check_uid=1
security.bsd.hardlink_check_gid=1

# Prevent unprivileged users from reading kernel message buffer
security.bsd.unprivileged_read_msgbuf=0

# 6. Port ACL (if MAC_PORTACL is enabled in kernel)
# Lock down binding to privileged ports (<1024) uniquely via capability bounding
security.mac.portacl.enabled=1
security.mac.portacl.port_high=1023
security.mac.portacl.suser_exempt=1
